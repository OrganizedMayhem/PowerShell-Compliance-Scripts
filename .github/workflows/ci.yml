name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/powershell-ci.yml
    with:
      pester-version: "5.5.0"
      test-path: "tests/Compliance.Tests.ps1"
      analyzer-path: "."
      run-smoke-test: true
      smoke-test-script: '.\Compliance.ps1'
