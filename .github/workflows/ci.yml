name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module PSScriptAnalyzer -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning, Error
          $results | Format-Table -AutoSize | Out-String | Write-Host

          $errors = $results | Where-Object Severity -eq 'Error'
          if ($errors) {
              Write-Error "PSScriptAnalyzer found $($errors.Count) error-level issue(s)."
              exit 1
          }

      - name: Run Pester tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.5.0

          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/Compliance.Tests.ps1'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.TestResult.OutputPath = 'TestResults.xml'

          Invoke-Pester -Configuration $config

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-test-results
          path: TestResults.xml

      - name: Smoke test - Compliance.ps1 -WhatIf
        shell: pwsh
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          $isAdmin = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)

          if (-not $isAdmin) {
              Write-Host "Skipping: Compliance.ps1 requires an elevated session (#requires -RunAsAdministrator) and this runner is not elevated."
              return
          }

          .\Compliance.ps1 -WhatIf -Verbose

